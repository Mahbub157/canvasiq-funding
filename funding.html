<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CanvasIQ — Funding Directory</title>
<meta name="description" content="Browse grants, competitions, accelerators, and awards — updated automatically every day."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --surface2:#f0f1f7; --surface3:#e8eaf5;
  --border:#e3e6ef; --border2:#d1d5e8;
  --accent:#5b4fff; --accent-light:#ede9ff; --accent-dark:#4338ca;
  --accent2:#00b894; --accent2-light:#e0faf4;
  --accent3:#f59e0b; --accent3-light:#fffbeb;
  --urgent:#e8294a; --urgent-light:#fff0f3;
  --warn:#d97706; --warn-light:#fffbeb;
  --text:#1a1d2e; --text2:#3d4263; --muted:#8b92b4;
  --shadow:0 1px 4px rgba(80,90,160,.07),0 4px 16px rgba(80,90,160,.06);
  --shadow-hover:0 4px 12px rgba(80,90,160,.13),0 12px 32px rgba(80,90,160,.10);
  --radius:14px; --radius-lg:20px; --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
a{color:inherit;text-decoration:none;}

/* ── NAV ── */
nav{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 40px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(80,90,160,.07);
}
.nav-inner{display:flex;align-items:center;height:64px;gap:24px;}
.nav-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-logo .logo-box{
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  color:#fff;font-weight:900;font-size:15px;padding:7px 13px;
  border-radius:10px;letter-spacing:-.3px;box-shadow:0 2px 10px rgba(91,79,255,.3);
}
.nav-logo .logo-name{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.nav-divider{width:1px;height:20px;background:var(--border);margin:0 4px;}
.nav-page{font-size:13px;font-weight:600;color:var(--muted);}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:16px;}
.nav-links a{
  padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--text2);transition:background .15s,color .15s;
}
.nav-links a:hover{background:var(--accent-light);color:var(--accent);}
.nav-links a.active{background:var(--accent-light);color:var(--accent);}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.btn-nav-ghost{
  padding:7px 15px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text2);border:1.5px solid var(--border2);background:#fff;
  cursor:pointer;transition:all .15s;font-family:var(--font);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-nav-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.live-dot-wrap{display:inline-flex;align-items:center;gap:6px;
  background:var(--accent2-light);border:1.5px solid #b2f0e2;
  color:#00916e;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;
}
.live-pulse{width:7px;height:7px;border-radius:50%;background:#00b894;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

/* ── URGENT STRIP ── */
#urgentBanner{
  background:linear-gradient(90deg,var(--urgent),#c0392b);
  color:#fff;padding:9px 40px;font-size:12.5px;font-weight:600;
  display:none;align-items:center;gap:12px;flex-wrap:wrap;
}
.banner-label{opacity:.85;white-space:nowrap;}
.banner-items{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.banner-chip{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:background .15s;
}
.banner-chip:hover{background:rgba(255,255,255,.3);}
.banner-dismiss{background:none;border:none;color:#fff;cursor:pointer;font-size:18px;margin-left:auto;opacity:.6;line-height:1;}
.banner-dismiss:hover{opacity:1;}

/* ── PAGE HEADER ── */
.page-header{
  background:#fff;border-bottom:1px solid var(--border);
  padding:28px 40px 20px;
  box-shadow:0 2px 16px rgba(80,90,160,.05);
}
.ph-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.ph-titles h1{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.5px;margin-bottom:4px;}
.ph-titles p{font-size:13px;color:var(--muted);font-weight:500;}
.ph-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
#lastUpdated{font-size:12px;color:var(--muted);}
.ph-search{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.search-wrap{position:relative;flex:1;min-width:240px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
input[type="text"]{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);font-size:13.5px;font-weight:500;
  padding:9px 12px 9px 38px;outline:none;transition:border-color .2s,box-shadow .2s;
  font-family:var(--font);
}
input[type="text"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,79,255,.1);background:#fff;}
input[type="text"]::placeholder{color:var(--muted);font-weight:400;}

/* Stats pills */
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.stat-pill{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:8px;padding:5px 13px;font-size:12.5px;color:var(--muted);font-weight:500;
  display:flex;align-items:center;gap:5px;
}
.stat-pill strong{color:var(--accent);font-weight:800;font-size:14px;}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-urgent{background:var(--urgent);}
.dot-soon{background:var(--accent3);}
.dot-rolling{background:var(--accent2);}
.dot-new{background:var(--accent);}

/* ── FILTER BAR ── */
.filter-bar{
  padding:10px 40px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.filter-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.filter-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding-right:2px;}
.filter-btn{
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--text2);font-size:12.5px;font-weight:600;
  padding:5px 13px;border-radius:20px;cursor:pointer;
  transition:all .15s;font-family:var(--font);
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,79,255,.2);}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 3px;}

/* ── SORT ROW ── */
.sort-row{
  padding:9px 40px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);
}
.sort-label{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px;}
.sort-btn{
  background:none;border:none;color:var(--muted);
  font-size:12.5px;font-weight:500;cursor:pointer;padding:4px 10px;
  border-radius:8px;transition:all .15s;font-family:var(--font);
}
.sort-btn:hover{color:var(--text);background:var(--surface);}
.sort-btn.active{color:var(--accent);font-weight:700;background:var(--accent-light);}
#resultCount{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}

/* ── LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 260px);}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;flex-shrink:0;padding:20px 16px;
  border-right:1px solid var(--border);background:#fff;
  position:sticky;top:64px;max-height:calc(100vh - 64px);overflow-y:auto;
}
.sidebar-title{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.tl-item{
  display:flex;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;
  transition:background .15s;border-bottom:1px solid var(--border);
}
.tl-item:hover{background:var(--bg);}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;padding-top:4px;}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tl-dot.urgent{background:var(--urgent);}
.tl-dot.soon{background:var(--accent3);}
.tl-dot.normal{background:var(--accent);}
.tl-dot.rolling{background:var(--accent2);}
.tl-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;}
.tl-date{font-size:11px;color:var(--muted);margin-top:2px;}
.tl-prize{font-size:11px;color:var(--accent2);margin-top:2px;font-weight:700;}

/* ── MAIN GRID ── */
.main-content{flex:1;min-width:0;background:var(--bg);}
.grid{
  padding:24px 32px 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:16px;
}

/* ── CARD ── */
.card{
  background:#fff;border:1.5px solid var(--border);
  border-radius:var(--radius);padding:22px;
  display:flex;flex-direction:column;gap:13px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s,transform .18s,border-color .2s;
  position:relative;overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);border-color:var(--accent);}
.card.urgent{border-left:3px solid var(--urgent);}
.card.soon{border-left:3px solid var(--accent3);}
.card.new-opp{border-left:3px solid var(--accent);}

/* Status strip at top */
.card-status-strip{
  display:flex;align-items:center;gap:6px;margin-bottom:-4px;
}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.urgent{background:var(--urgent);}
.status-dot.soon{background:var(--accent3);}
.status-dot.normal{background:var(--accent);}
.status-dot.rolling{background:var(--accent2);}
.status-text{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.status-text.urgent{color:var(--urgent);}
.status-text.soon{color:var(--accent3);}
.status-text.normal{color:var(--accent);}
.status-text.rolling{color:var(--accent2);}

/* New badge */
.new-badge{
  position:absolute;top:14px;right:14px;
  background:var(--accent);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.5px;
  padding:3px 9px;border-radius:6px;text-transform:uppercase;
}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.card-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.35;flex:1;letter-spacing:-.2px;}
.prize-badge{
  background:var(--accent2-light);border:1.5px solid #b2f0e2;
  color:#00916e;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:9px;white-space:nowrap;flex-shrink:0;
}
.card-desc{font-size:13px;color:var(--text2);line-height:1.65;}

/* Deadline */
.deadline-row{display:flex;flex-direction:column;gap:5px;}
.deadline-pill{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;
}
.deadline-pill.urgent{background:var(--urgent-light);color:var(--urgent);border:1.5px solid #ffc4ce;}
.deadline-pill.soon{background:var(--warn-light);color:var(--warn);border:1.5px solid #fde68a;}
.deadline-pill.normal{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);}
.deadline-pill.rolling{background:var(--accent-light);color:var(--accent);border:1.5px solid #c4bdff;}
.deadline-icon{opacity:.6;}
.countdown{
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;display:inline-block;
}
.countdown.urgent{background:var(--urgent-light);color:var(--urgent);}
.countdown.soon{background:var(--warn-light);color:var(--warn);}
.countdown.normal{background:var(--surface2);color:var(--muted);}

/* Tags */
.tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.2px;}
.tag-type-grant      {background:#e6faf5;color:#007a5e;}
.tag-type-competition{background:var(--accent-light);color:#4338ca;}
.tag-type-accelerator{background:#fffbeb;color:#92400e;}
.tag-type-corporate  {background:#eff6ff;color:#1d4ed8;}
.tag-type-award      {background:#fdf2f8;color:#9d174d;}
.tag-loc-nyc         {background:#fff0f3;color:#be123c;}
.tag-loc-national    {background:#eff6ff;color:#1e40af;}
.tag-loc-virtual     {background:#f0fdf4;color:#166534;}
.tag-loc-global      {background:#faf5ff;color:#6b21a8;}
.tag-sector-edtech   {background:#ecfdf5;color:#065f46;}
.tag-sector-ai       {background:#fffbeb;color:#92400e;}
.tag-sector-women    {background:#fdf2f8;color:#831843;}
.tag-sector-bipoc    {background:#fff7ed;color:#9a3412;}
.tag-sector-general  {background:var(--surface3);color:var(--text2);}

/* Equity + source */
.meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.equity-badge{
  display:inline-block;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:6px;
}
.equity-badge.no-equity{background:#e6faf5;border:1px solid #b2f0e2;color:#007a5e;}
.equity-badge.has-equity{background:#fffbeb;border:1px solid #fde68a;color:#b45309;}
.source-badge{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted);
}
.source-badge.auto{background:var(--accent-light);border-color:#c4bdff;color:var(--accent);}

/* Actions */
.card-actions{display:flex;gap:10px;margin-top:2px;}
.btn-apply{
  flex:1;background:var(--accent);color:#fff;
  border:none;border-radius:9px;padding:10px 16px;
  font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;text-align:center;
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 2px 8px rgba(91,79,255,.2);font-family:var(--font);
}
.btn-apply:hover{background:var(--accent-dark);box-shadow:0 4px 14px rgba(91,79,255,.35);}
.btn-save{
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--muted);border-radius:9px;padding:10px 14px;
  font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--font);
  font-weight:600;
}
.btn-save:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-save.saved{border-color:var(--accent2);color:var(--accent2);background:var(--accent2-light);}

/* No results */
.no-results{
  grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);
}
.no-results svg{margin:0 auto 16px;display:block;opacity:.4;}
.no-results p{font-size:15px;font-weight:500;}

/* Skeleton */
.skeleton-card{
  background:#fff;border:1.5px solid var(--border);
  border-radius:var(--radius);padding:22px;
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);
}
.skeleton-line{
  height:13px;border-radius:6px;
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);
  background-size:400% 100%;animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skeleton-line.tall{height:22px;}
.skeleton-line.w80{width:80%;}
.skeleton-line.w60{width:60%;}
.skeleton-line.w40{width:40%;}

/* Responsive */
@media(max-width:900px){
  nav,.page-header,.filter-bar,.sort-row{padding-left:20px;padding-right:20px;}
  .grid{padding:16px 16px 40px;grid-template-columns:1fr;}
  .sidebar{display:none;}
  #urgentBanner{padding:9px 20px;}
  .nav-links{display:none;}
}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="./index.html" class="nav-logo">
      <div class="logo-box">CIQ</div>
      <span class="logo-name">CanvasIQ</span>
    </a>
    <div class="nav-divider"></div>
    <span class="nav-page">Funding Directory</span>
    <div class="nav-links">
      <a href="./index.html">Home</a>
      <a href="./index.html#tools">Tools &amp; Deals</a>
      <a href="./index.html#resources">Resources</a>
      <a href="./index.html#jobs">Jobs</a>
    </div>
    <div class="nav-right">
      <div class="live-dot-wrap" id="liveBadge">
        <span class="live-pulse"></span>
        <span id="liveText">Loading</span>
      </div>
      <a href="./index.html#newsletter" class="btn-nav-ghost">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Get Alerts
      </a>
    </div>
  </div>
</nav>

<!-- URGENT STRIP -->
<div id="urgentBanner">
  <span class="banner-label">Closing soon —</span>
  <div class="banner-items" id="bannerItems"></div>
  <button class="banner-dismiss" onclick="document.getElementById('urgentBanner').style.display='none'">&#215;</button>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="ph-top">
    <div class="ph-titles">
      <h1>Pre-Seed Funding Directory</h1>
      <p>Grants &middot; Competitions &middot; Accelerators &middot; Corporate Programs &middot; Awards</p>
    </div>
    <div class="ph-right">
      <span id="lastUpdated"></span>
    </div>
  </div>
  <div class="ph-search">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search by name, prize, keyword..." oninput="applyFilters()"/>
    </div>
  </div>
  <div class="stats-row" id="statsRow">
    <div class="stat-pill"><strong id="totalCount">—</strong> Total</div>
    <div class="stat-pill"><span class="stat-dot dot-urgent"></span><strong id="urgentCount">—</strong> Urgent</div>
    <div class="stat-pill"><span class="stat-dot dot-soon"></span><strong id="soonCount">—</strong> Closing Soon</div>
    <div class="stat-pill"><span class="stat-dot dot-new"></span><strong id="newCount">—</strong> New This Week</div>
    <div class="stat-pill"><span class="stat-dot dot-rolling"></span><strong id="rollingCount">—</strong> Rolling</div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <button class="filter-btn active" onclick="setFilter('type','all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('type','grant',this)">Grant</button>
    <button class="filter-btn" onclick="setFilter('type','competition',this)">Competition</button>
    <button class="filter-btn" onclick="setFilter('type','accelerator',this)">Accelerator</button>
    <button class="filter-btn" onclick="setFilter('type','corporate',this)">Corporate</button>
    <button class="filter-btn" onclick="setFilter('type','award',this)">Award</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">Location</span>
    <button class="filter-btn" onclick="setFilter('loc','nyc',this)">NYC</button>
    <button class="filter-btn" onclick="setFilter('loc','national',this)">National</button>
    <button class="filter-btn" onclick="setFilter('loc','virtual',this)">Virtual</button>
    <button class="filter-btn" onclick="setFilter('loc','global',this)">Global</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">Focus</span>
    <button class="filter-btn" onclick="setFilter('sector','edtech',this)">EdTech</button>
    <button class="filter-btn" onclick="setFilter('sector','ai',this)">AI</button>
    <button class="filter-btn" onclick="setFilter('sector','women',this)">Women</button>
    <button class="filter-btn" onclick="setFilter('sector','bipoc',this)">BIPOC</button>
    <button class="filter-btn" onclick="setFilter('sector','general',this)">General</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <button class="filter-btn" onclick="setFilter('special','saved',this)" id="savedBtn">Saved</button>
    <button class="filter-btn" onclick="setFilter('special','new',this)" id="newBtn">New This Week</button>
    <button class="filter-btn" onclick="setFilter('special','noeq',this)">Non-Dilutive</button>
  </div>
</div>

<!-- SORT ROW -->
<div class="sort-row">
  <span class="sort-label">Sort:</span>
  <button class="sort-btn active" onclick="setSort('deadline',this)">Deadline</button>
  <button class="sort-btn" onclick="setSort('prize',this)">Prize Value</button>
  <button class="sort-btn" onclick="setSort('name',this)">Name A–Z</button>
  <button class="sort-btn" onclick="setSort('added',this)">Recently Added</button>
  <span id="resultCount"></span>
</div>

<!-- LAYOUT -->
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">Deadline Timeline</div>
    <div id="timeline"></div>
  </aside>
  <div class="main-content">
    <div class="grid" id="grid">
      <div class="skeleton-card"><div class="skeleton-line tall w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
      <div class="skeleton-card"><div class="skeleton-line tall w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
      <div class="skeleton-card"><div class="skeleton-line tall w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
    </div>
  </div>
</div>

<script>
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let allOpps = [];
let filters = { type:'all', loc:null, sector:null, special:null };
let sortBy = 'deadline';
let savedIds = new Set(JSON.parse(localStorage.getItem('ciq_saved')||'[]'));

async function loadData() {
  try {
    const res = await fetch('./data.json?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allOpps = data.opportunities || [];
    updateLastUpdated(data.lastUpdated);
    document.getElementById('liveText').textContent = 'Live — Updated Daily';
  } catch(e) {
    console.warn('data.json not found:', e.message);
    document.getElementById('liveText').textContent = 'Offline';
    document.querySelector('.live-pulse').style.background = '#d97706';
  }
  applyFilters();
  buildBanner();
}

function updateLastUpdated(iso) {
  if (!iso) return;
  const diffH = Math.floor((Date.now() - new Date(iso)) / 3600000);
  const diffD = Math.floor(diffH / 24);
  const label = diffD === 0 ? (diffH < 1 ? 'Updated just now' : `Updated ${diffH}h ago`)
              : diffD === 1 ? 'Updated yesterday' : `Updated ${diffD} days ago`;
  document.getElementById('lastUpdated').textContent = label;
}

function daysUntil(d) {
  if (!d || d === 'rolling') return 99999;
  const t = new Date(d); t.setHours(0,0,0,0);
  return Math.ceil((t - TODAY) / 86400000);
}
function deadlineStatus(d) {
  const n = daysUntil(d);
  if (n === 99999) return 'rolling';
  if (n <= 7)  return 'urgent';
  if (n <= 30) return 'soon';
  return 'normal';
}
function isNew(addedDate) {
  if (!addedDate) return false;
  const d = new Date(addedDate); d.setHours(0,0,0,0);
  return (TODAY - d) / 86400000 <= 7;
}
function countdownText(d) {
  const n = daysUntil(d);
  if (n === 99999) return null;
  if (n < 0) return 'Past deadline';
  if (n === 0) return 'Closes today';
  if (n === 1) return '1 day left';
  return `${n} days left`;
}

function setFilter(dim, val, btn) {
  if (dim === 'type') {
    filters.type = val;
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (['All','Grant','Competition','Accelerator','Corporate','Award'].includes(b.textContent.trim()))
        b.classList.remove('active');
    });
  } else if (dim === 'loc') {
    filters.loc = filters.loc === val ? null : val;
    ['NYC','National','Virtual','Global'].forEach(v => {
      document.querySelectorAll('.filter-btn').forEach(b => { if(b.textContent.trim()===v) b.classList.remove('active'); });
    });
  } else if (dim === 'sector') {
    filters.sector = filters.sector === val ? null : val;
    ['EdTech','AI','Women','BIPOC','General'].forEach(v => {
      document.querySelectorAll('.filter-btn').forEach(b => { if(b.textContent.trim()===v) b.classList.remove('active'); });
    });
  } else if (dim === 'special') {
    filters.special = filters.special === val ? null : val;
    document.querySelectorAll('#savedBtn,#newBtn').forEach(b => b.classList.remove('active'));
    const noeqBtn = [...document.querySelectorAll('.filter-btn')].find(b=>b.textContent.trim()==='Non-Dilutive');
    if(noeqBtn) noeqBtn.classList.remove('active');
  }
  if (!(dim==='loc' && !filters.loc) && !(dim==='sector' && !filters.sector) && !(dim==='special' && !filters.special))
    btn.classList.add('active');
  applyFilters();
}

function setSort(s, btn) {
  sortBy = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  let list = allOpps.filter(o => {
    if (filters.type !== 'all' && o.type !== filters.type) return false;
    if (filters.loc && !o.loc.includes(filters.loc)) return false;
    if (filters.sector && !o.sector.includes(filters.sector)) return false;
    if (filters.special === 'saved' && !savedIds.has(o.id)) return false;
    if (filters.special === 'new' && !isNew(o.addedDate)) return false;
    if (filters.special === 'noeq' && o.equity !== false) return false;
    if (q && !o.name.toLowerCase().includes(q) && !o.desc.toLowerCase().includes(q) && !(o.prize||'').toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a,b) => {
    if (sortBy === 'deadline') return daysUntil(a.deadline) - daysUntil(b.deadline);
    if (sortBy === 'prize') return (b.prizeVal||0) - (a.prizeVal||0);
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    if (sortBy === 'added') return (b.addedDate||'').localeCompare(a.addedDate||'');
    return 0;
  });
  renderGrid(list);
  renderTimeline(allOpps.filter(o=>o.deadline!=='rolling').sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,15));
  updateStats(list);
  document.getElementById('resultCount').textContent = `${list.length} result${list.length!==1?'s':''}`;
}

const typeLabel = {grant:'Grant',competition:'Competition',accelerator:'Accelerator',corporate:'Corporate',award:'Award'};
const locLabel  = {nyc:'NYC',national:'National',virtual:'Virtual',global:'Global'};
const secLabel  = {edtech:'EdTech',ai:'AI',women:'Women',bipoc:'BIPOC',general:'General'};

function renderGrid(list) {
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="no-results">
      <svg width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No opportunities match your filters.</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

function cardHTML(o) {
  const status = deadlineStatus(o.deadline);
  const fresh  = isNew(o.addedDate);
  const saved  = savedIds.has(o.id);
  const cdText = countdownText(o.deadline);
  const isAuto = o.source === 'auto';
  const borderClass = status==='urgent'?'urgent':status==='soon'?'soon':fresh?'new-opp':'';
  const statusLabels = {urgent:'Urgent',soon:'Closing Soon',normal:'Open',rolling:'Rolling'};
  const calIcon = `<svg class="deadline-icon" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

  return `<div class="card ${borderClass}" id="card-${o.id}">
    ${fresh?`<div class="new-badge">New</div>`:''}
    <div class="card-status-strip">
      <span class="status-dot ${status}"></span>
      <span class="status-text ${status}">${statusLabels[status]||'Open'}</span>
      ${cdText?`<span style="font-size:11px;color:var(--muted);margin-left:4px;">— ${cdText}</span>`:''}
    </div>
    <div class="card-top">
      <div class="card-title">${esc(o.name)}</div>
      <div class="prize-badge">${esc(o.prize)}</div>
    </div>
    <div class="card-desc">${esc(o.desc)}</div>
    <div class="deadline-row">
      <div class="deadline-pill ${status}">${calIcon} ${esc(o.deadlineLabel)}</div>
    </div>
    <div class="tags">
      <span class="tag tag-type-${o.type}">${typeLabel[o.type]||o.type}</span>
      ${(o.loc||[]).map(l=>`<span class="tag tag-loc-${l}">${locLabel[l]||l}</span>`).join('')}
      ${(o.sector||[]).map(s=>`<span class="tag tag-sector-${s}">${secLabel[s]||s}</span>`).join('')}
    </div>
    <div class="meta-row">
      <span class="equity-badge ${o.equity===false?'no-equity':'has-equity'}">${o.equity===false?'Non-dilutive':'May involve equity'}</span>
      <span class="source-badge ${isAuto?'auto':''}">${isAuto?'Auto-found':'Verified'}</span>
    </div>
    <div class="card-actions">
      <a class="btn-apply" href="${o.url||'#'}" target="_blank" rel="noopener">Apply / Learn More</a>
      <button class="btn-save ${saved?'saved':''}" onclick="toggleSave(${o.id},this)">${saved?'Saved':'Save'}</button>
    </div>
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderTimeline(list) {
  const el = document.getElementById('timeline');
  if (!list.length){el.innerHTML='<p style="font-size:12px;color:var(--muted);padding:8px;">No dated deadlines.</p>';return;}
  el.innerHTML = list.map(o => {
    const s = deadlineStatus(o.deadline);
    return `<div class="tl-item" onclick="scrollToCard(${o.id})">
      <div class="tl-dot-wrap"><div class="tl-dot ${s}"></div></div>
      <div>
        <div class="tl-name">${esc(o.name)}</div>
        <div class="tl-date">${esc(o.deadlineLabel)}</div>
        <div class="tl-prize">${esc(o.prize)}</div>
      </div>
    </div>`;
  }).join('');
}
function scrollToCard(id){
  const el=document.getElementById('card-'+id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
}

function updateStats(list){
  document.getElementById('totalCount').textContent   = list.length;
  document.getElementById('urgentCount').textContent  = list.filter(o=>deadlineStatus(o.deadline)==='urgent').length;
  document.getElementById('soonCount').textContent    = list.filter(o=>deadlineStatus(o.deadline)==='soon').length;
  document.getElementById('newCount').textContent     = list.filter(o=>isNew(o.addedDate)).length;
  document.getElementById('rollingCount').textContent = list.filter(o=>o.deadline==='rolling').length;
}

function buildBanner(){
  const urgent = allOpps.filter(o=>{const n=daysUntil(o.deadline);return n>=0&&n<=5;});
  if(!urgent.length)return;
  document.getElementById('bannerItems').innerHTML = urgent.map(o=>{
    const n=daysUntil(o.deadline);
    const label=n===0?'Closes today':n===1?'1 day left':`${n} days left`;
    return `<span class="banner-chip" onclick="scrollToCard(${o.id})">${esc(o.name.split('—')[0].trim())} — ${label}</span>`;
  }).join('');
  document.getElementById('urgentBanner').style.display='flex';
}

function toggleSave(id,btn){
  if(savedIds.has(id)){savedIds.delete(id);btn.textContent='Save';btn.classList.remove('saved');}
  else{savedIds.add(id);btn.textContent='Saved';btn.classList.add('saved');}
  localStorage.setItem('ciq_saved',JSON.stringify([...savedIds]));
}

loadData();
</script>
</body>
</html>
