<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CanvasIQ — Funding Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --surface2:#f0f1f7;
  --border:#e3e6ef; --border2:#d1d5e8;
  --accent:#5b4fff; --accent-light:#ede9ff;
  --accent2:#00b894; --accent2-light:#e0faf4;
  --urgent:#e8294a; --urgent-light:#fff0f3;
  --warn:#d97706; --warn-light:#fffbeb;
  --text:#1a1d2e; --text2:#3d4263; --muted:#8b92b4;
  --shadow:0 1px 4px rgba(80,90,160,.07),0 4px 16px rgba(80,90,160,.06);
  --shadow-hover:0 4px 12px rgba(80,90,160,.12),0 12px 32px rgba(80,90,160,.10);
  --radius:14px; --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

/* ── URGENT BANNER ── */
#urgentBanner{
  background:linear-gradient(90deg,#e8294a,#c0392b);
  color:#fff; padding:10px 40px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  animation: slidein .4s ease;
}
@keyframes slidein{from{transform:translateY(-100%)}to{transform:translateY(0)}}
#urgentBanner .banner-items{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
.banner-chip{
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3);
  border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700;
  white-space:nowrap; cursor:pointer; transition:background .15s;
}
.banner-chip:hover{background:rgba(255,255,255,.3);}
.banner-dismiss{background:none;border:none;color:#fff;cursor:pointer;font-size:18px;margin-left:auto;opacity:.7;}
.banner-dismiss:hover{opacity:1;}

/* ── HEADER ── */
header{
  background:#fff; border-bottom:1px solid var(--border);
  padding:24px 40px 18px;
  position:sticky; top:0; z-index:100;
  box-shadow:0 1px 0 var(--border),0 4px 16px rgba(80,90,160,.06);
}
.header-row1{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.logo{
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  color:#fff;font-weight:800;font-size:17px;padding:8px 16px;
  border-radius:10px;letter-spacing:-.5px;
  box-shadow:0 2px 8px rgba(91,79,255,.3);
}
.header-title h1{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.4px;}
.header-title p{font-size:13px;color:var(--muted);margin-top:2px;font-weight:500;}

/* Live indicator */
.live-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent2-light);border:1.5px solid #b2f0e2;
  color:#00916e;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;margin-left:auto;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:#00b894;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

/* Search */
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
input[type="text"]{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;font-weight:500;
  padding:9px 12px 9px 38px;outline:none;transition:border-color .2s,box-shadow .2s;
  font-family:var(--font);
}
input[type="text"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,79,255,.1);background:#fff;}
input[type="text"]::placeholder{color:var(--muted);font-weight:400;}

.header-row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

/* Stats */
.stats-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.stat{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:6px 14px;
  font-size:13px;color:var(--muted);font-weight:500;
}
.stat span{color:var(--accent);font-weight:800;font-size:15px;margin-right:4px;}

/* Last updated */
#lastUpdated{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;}

/* ── FILTER BAR ── */
.filter-bar{
  padding:12px 40px;border-bottom:1px solid var(--border);
  background:#fff;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
}
.filter-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-right:2px;}
.filter-btn{
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--text2);font-size:12.5px;font-weight:600;
  padding:5px 13px;border-radius:20px;cursor:pointer;
  transition:all .15s;font-family:var(--font);
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(91,79,255,.25);}
.divider{width:1px;height:22px;background:var(--border);margin:0 4px;}

/* ── SORT ROW ── */
.sort-row{
  padding:10px 40px;background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);
}
.sort-btn{
  background:none;border:none;color:var(--muted);
  font-size:13px;font-weight:500;cursor:pointer;padding:4px 10px;
  border-radius:8px;transition:all .15s;font-family:var(--font);
}
.sort-btn:hover{color:var(--text);background:#fff;}
.sort-btn.active{color:var(--accent);font-weight:700;background:var(--accent-light);}
#resultCount{margin-left:auto;font-size:12px;color:var(--muted);}

/* ── LAYOUT ── */
.layout{display:flex;}

/* ── SIDEBAR ── */
.sidebar{
  width:272px;flex-shrink:0;padding:20px 16px;
  border-right:1px solid var(--border);background:#fff;
  position:sticky;top:170px;
  max-height:calc(100vh - 170px);overflow-y:auto;
}
.sidebar h3{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.tl-item{
  display:flex;gap:11px;padding:10px 8px;
  border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .15s;border-radius:8px;
}
.tl-item:hover{background:var(--bg);}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tl-dot.urgent{background:var(--urgent);box-shadow:0 0 5px rgba(232,41,74,.4);}
.tl-dot.soon{background:var(--warn);box-shadow:0 0 5px rgba(217,119,6,.3);}
.tl-dot.normal{background:var(--accent);}
.tl-dot.rolling{background:var(--accent2);}
.tl-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;}
.tl-date{font-size:11px;color:var(--muted);margin-top:2px;}
.tl-prize{font-size:11px;color:#00916e;margin-top:2px;font-weight:700;}

/* ── GRID ── */
.main-content{flex:1;min-width:0;background:var(--bg);}
.grid{
  padding:24px 36px 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:18px;
}

/* ── CARD ── */
.card{
  background:#fff;border:1.5px solid var(--border);
  border-radius:var(--radius);padding:22px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s,transform .18s,border-color .2s;
  position:relative;overflow:hidden;
}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);border-color:var(--accent);}
.card.urgent{border-top:3px solid var(--urgent);}
.card.soon{border-top:3px solid var(--warn);}
.card.new-opp{border-top:3px solid var(--accent);}

/* NEW badge */
.new-badge{
  position:absolute;top:14px;right:14px;
  background:var(--accent);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.5px;
  padding:3px 8px;border-radius:4px;text-transform:uppercase;
}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.card-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.35;flex:1;letter-spacing:-.2px;}

.prize-badge{
  background:var(--accent2-light);border:1.5px solid #b2f0e2;
  color:#00916e;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:8px;white-space:nowrap;flex-shrink:0;
}

.card-desc{font-size:13px;color:var(--text2);line-height:1.65;}

/* Deadline + countdown */
.deadline-row{display:flex;flex-direction:column;gap:5px;}
.deadline-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;
}
.deadline-pill.urgent{background:var(--urgent-light);color:var(--urgent);border:1.5px solid #ffc4ce;}
.deadline-pill.soon{background:var(--warn-light);color:var(--warn);border:1.5px solid #fde68a;}
.deadline-pill.normal{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);}
.deadline-pill.rolling{background:var(--accent-light);color:var(--accent);border:1.5px solid #c4bdff;}

.countdown{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
  display:inline-block;
}
.countdown.urgent{background:var(--urgent-light);color:var(--urgent);}
.countdown.soon{background:var(--warn-light);color:var(--warn);}
.countdown.normal{background:var(--surface2);color:var(--muted);}

/* Tags */
.tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;}
.tag-type-grant      {background:#e6faf5;color:#007a5e;}
.tag-type-competition{background:var(--accent-light);color:#4338ca;}
.tag-type-accelerator{background:#fffbeb;color:#92400e;}
.tag-type-corporate  {background:#eff6ff;color:#1d4ed8;}
.tag-type-award      {background:#fdf2f8;color:#9d174d;}
.tag-loc-nyc         {background:#fff0f3;color:#be123c;}
.tag-loc-national    {background:#eff6ff;color:#1e40af;}
.tag-loc-virtual     {background:#f0fdf4;color:#166534;}
.tag-loc-global      {background:#faf5ff;color:#6b21a8;}
.tag-sector-edtech   {background:#ecfdf5;color:#065f46;}
.tag-sector-ai       {background:#fffbeb;color:#92400e;}
.tag-sector-women    {background:#fdf2f8;color:#831843;}
.tag-sector-bipoc    {background:#fff7ed;color:#9a3412;}
.tag-sector-general  {background:#f8fafc;color:#475569;}

/* Equity badge */
.equity-badge{
  display:inline-block;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:5px;
}
.equity-badge.no-equity{background:#e6faf5;border:1px solid #b2f0e2;color:#007a5e;}
.equity-badge.has-equity{background:#fffbeb;border:1px solid #fde68a;color:#b45309;}

/* Source badge */
.source-auto{
  font-size:10px;font-weight:700;color:var(--accent);
  background:var(--accent-light);border:1px solid #c4bdff;
  border-radius:4px;padding:2px 7px;display:inline-block;
}

/* Actions */
.card-actions{display:flex;gap:10px;margin-top:4px;}
.btn-apply{
  flex:1;background:var(--accent);color:#fff;
  border:none;border-radius:9px;padding:10px 16px;
  font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;text-align:center;
  transition:background .15s,box-shadow .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 2px 8px rgba(91,79,255,.25);font-family:var(--font);
}
.btn-apply:hover{background:#4b3fe0;box-shadow:0 4px 14px rgba(91,79,255,.35);transform:scale(.99);}
.btn-save{
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--muted);border-radius:9px;padding:10px 14px;
  font-size:15px;cursor:pointer;transition:all .15s;font-family:var(--font);
}
.btn-save:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn-save.saved{border-color:var(--accent2);color:var(--accent2);background:var(--accent2-light);}

/* No results */
.no-results{
  grid-column:1/-1;text-align:center;padding:80px 20px;
  color:var(--muted);font-size:16px;
}

/* Loading skeleton */
.skeleton-card{
  background:#fff;border:1.5px solid var(--border);
  border-radius:var(--radius);padding:22px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow);
}
.skeleton-line{
  height:14px;border-radius:6px;
  background:linear-gradient(90deg,#f0f1f7 25%,#e3e6ef 50%,#f0f1f7 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-line.w-80{width:80%;}
.skeleton-line.w-60{width:60%;}
.skeleton-line.w-40{width:40%;}
.skeleton-line.h-24{height:24px;}

/* Responsive */
@media(max-width:900px){
  header,.filter-bar,.sort-row{padding-left:20px;padding-right:20px;}
  .grid{padding:16px 20px 40px;grid-template-columns:1fr;}
  .sidebar{display:none;}
  #urgentBanner{padding:10px 20px;}
}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
</style>
</head>
<body>

<!-- URGENT BANNER (populated by JS) -->
<div id="urgentBanner" style="display:none;">
  <span>🚨 Closing soon:</span>
  <div class="banner-items" id="bannerItems"></div>
  <button class="banner-dismiss" onclick="document.getElementById('urgentBanner').style.display='none'">×</button>
</div>

<!-- HEADER -->
<header>
  <div class="header-row1">
    <div class="logo">CanvasIQ</div>
    <div class="header-title">
      <h1>Pre-Seed Funding Directory</h1>
      <p>Grants · Competitions · Accelerators · Corporate Programs</p>
    </div>
    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <span id="liveText">Loading…</span>
    </div>
  </div>
  <div class="header-row2">
    <div class="search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search by name, prize, keyword…" oninput="applyFilters()"/>
    </div>
    <span id="lastUpdated">–</span>
  </div>
  <div class="stats-row" id="statsRow">
    <div class="stat"><span id="totalCount">–</span> Total</div>
    <div class="stat"><span id="urgentCount">–</span> 🔴 Urgent</div>
    <div class="stat"><span id="soonCount">–</span> 🟡 Closing Soon</div>
    <div class="stat"><span id="newCount">–</span> ✨ New This Week</div>
    <div class="stat"><span id="rollingCount">–</span> 🔵 Rolling</div>
  </div>
</header>

<!-- FILTER BAR -->
<div class="filter-bar">
  <span class="filter-label">Type</span>
  <button class="filter-btn active" onclick="setFilter('type','all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('type','grant',this)">Grant</button>
  <button class="filter-btn" onclick="setFilter('type','competition',this)">Competition</button>
  <button class="filter-btn" onclick="setFilter('type','accelerator',this)">Accelerator</button>
  <button class="filter-btn" onclick="setFilter('type','corporate',this)">Corporate</button>
  <button class="filter-btn" onclick="setFilter('type','award',this)">Award</button>
  <div class="divider"></div>
  <span class="filter-label">Location</span>
  <button class="filter-btn" onclick="setFilter('loc','nyc',this)">NYC</button>
  <button class="filter-btn" onclick="setFilter('loc','national',this)">National</button>
  <button class="filter-btn" onclick="setFilter('loc','virtual',this)">Virtual</button>
  <button class="filter-btn" onclick="setFilter('loc','global',this)">Global</button>
  <div class="divider"></div>
  <span class="filter-label">Focus</span>
  <button class="filter-btn" onclick="setFilter('sector','edtech',this)">EdTech</button>
  <button class="filter-btn" onclick="setFilter('sector','ai',this)">AI</button>
  <button class="filter-btn" onclick="setFilter('sector','women',this)">Women</button>
  <button class="filter-btn" onclick="setFilter('sector','bipoc',this)">BIPOC</button>
  <button class="filter-btn" onclick="setFilter('sector','general',this)">General</button>
  <div class="divider"></div>
  <button class="filter-btn" onclick="setFilter('special','saved',this)" id="savedBtn">★ Saved</button>
  <button class="filter-btn" onclick="setFilter('special','new',this)" id="newBtn">✨ New</button>
  <button class="filter-btn" onclick="setFilter('special','noeq',this)">Non-Dilutive</button>
</div>

<!-- SORT ROW -->
<div class="sort-row">
  <span>Sort by:</span>
  <button class="sort-btn active" onclick="setSort('deadline',this)">Deadline</button>
  <button class="sort-btn" onclick="setSort('prize',this)">Prize ↓</button>
  <button class="sort-btn" onclick="setSort('name',this)">Name A–Z</button>
  <button class="sort-btn" onclick="setSort('added',this)">Recently Added</button>
  <span id="resultCount"></span>
</div>

<div class="layout">
  <!-- TIMELINE SIDEBAR -->
  <aside class="sidebar">
    <h3>⏱ Deadline Timeline</h3>
    <div id="timeline"></div>
  </aside>

  <!-- MAIN GRID -->
  <div class="main-content">
    <div class="grid" id="grid">
      <!-- skeleton loading -->
      <div class="skeleton-card"><div class="skeleton-line h-24 w-80"></div><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
      <div class="skeleton-card"><div class="skeleton-line h-24 w-80"></div><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
      <div class="skeleton-card"><div class="skeleton-line h-24 w-80"></div><div class="skeleton-line w-60"></div><div class="skeleton-line w-40"></div></div>
    </div>
  </div>
</div>

<script>
// ── globals ──────────────────────────────────────────────────────────────────
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
let allOpps = [];
let filters = { type:'all', loc:null, sector:null, special:null };
let sortBy = 'deadline';
let savedIds = new Set(JSON.parse(localStorage.getItem('ciq_saved')||'[]'));

// ── load data ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('./data.json?_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allOpps = data.opportunities || [];
    updateLastUpdated(data.lastUpdated);
    document.getElementById('liveText').textContent = 'Live · Auto-updated daily';
  } catch(e) {
    // Fallback: data might be embedded
    console.warn('Could not fetch data.json:', e.message);
    document.getElementById('liveText').textContent = 'Offline mode';
    document.querySelector('.live-dot').style.background = '#d97706';
  }
  applyFilters();
  buildBanner();
}

function updateLastUpdated(iso) {
  if (!iso) return;
  const d = new Date(iso);
  const diffMs = Date.now() - d.getTime();
  const diffH = Math.floor(diffMs / 3600000);
  const diffD = Math.floor(diffH / 24);
  let label = diffD === 0 ? (diffH < 1 ? 'Updated just now' : `Updated ${diffH}h ago`)
            : diffD === 1 ? 'Updated yesterday'
            : `Updated ${diffD} days ago`;
  document.getElementById('lastUpdated').textContent = label;
}

// ── deadline helpers ─────────────────────────────────────────────────────────
function daysUntil(d) {
  if (!d || d === 'rolling') return 99999;
  const target = new Date(d); target.setHours(0,0,0,0);
  return Math.ceil((target - TODAY) / 86400000);
}

function deadlineStatus(d) {
  const n = daysUntil(d);
  if (n === 99999) return 'rolling';
  if (n <= 0)  return 'urgent';   // past but still shown
  if (n <= 7)  return 'urgent';
  if (n <= 30) return 'soon';
  return 'normal';
}

function isNew(addedDate) {
  if (!addedDate) return false;
  const d = new Date(addedDate); d.setHours(0,0,0,0);
  return (TODAY - d) / 86400000 <= 7;
}

function countdownText(d) {
  const n = daysUntil(d);
  if (n === 99999) return null;
  if (n < 0)  return 'Past deadline';
  if (n === 0) return 'Closes TODAY';
  if (n === 1) return '1 day left';
  return `${n} days left`;
}

// ── filters & sort ───────────────────────────────────────────────────────────
function setFilter(dim, val, btn) {
  const typeVals = ['all','grant','competition','accelerator','corporate','award'];
  const locVals  = ['nyc','national','virtual','global'];
  const secVals  = ['edtech','ai','women','bipoc','general'];
  const spVals   = ['saved','new','noeq'];

  if (dim === 'type') {
    filters.type = val;
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (typeVals.some(v => b.textContent.trim().toLowerCase() === v || b.textContent.trim() === 'All')) b.classList.remove('active');
    });
  } else if (dim === 'loc') {
    filters.loc = filters.loc === val ? null : val;
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (['NYC','National','Virtual','Global'].includes(b.textContent.trim())) b.classList.remove('active');
    });
  } else if (dim === 'sector') {
    filters.sector = filters.sector === val ? null : val;
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (['EdTech','AI','Women','BIPOC','General'].includes(b.textContent.trim())) b.classList.remove('active');
    });
  } else if (dim === 'special') {
    filters.special = filters.special === val ? null : val;
    document.querySelectorAll('#savedBtn,#newBtn').forEach(b => b.classList.remove('active'));
    if (btn.id === 'savedBtn' || btn.textContent.includes('Non')) {
      if (filters.special) btn.classList.add('active');
    }
  }

  if (!(dim==='loc' && !filters.loc) && !(dim==='sector' && !filters.sector) && !(dim==='special' && !filters.special)) {
    btn.classList.add('active');
  }
  applyFilters();
}

function setSort(s, btn) {
  sortBy = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();

  let list = allOpps.filter(o => {
    if (filters.type !== 'all' && o.type !== filters.type) return false;
    if (filters.loc && !o.loc.includes(filters.loc)) return false;
    if (filters.sector && !o.sector.includes(filters.sector)) return false;
    if (filters.special === 'saved' && !savedIds.has(o.id)) return false;
    if (filters.special === 'new' && !isNew(o.addedDate)) return false;
    if (filters.special === 'noeq' && o.equity !== false) return false;
    if (q && !o.name.toLowerCase().includes(q) &&
             !o.desc.toLowerCase().includes(q) &&
             !o.prize.toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort((a,b) => {
    if (sortBy === 'deadline') return (daysUntil(a.deadline)) - (daysUntil(b.deadline));
    if (sortBy === 'prize') return b.prizeVal - a.prizeVal;
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    if (sortBy === 'added') return (b.addedDate||'').localeCompare(a.addedDate||'');
    return 0;
  });

  renderGrid(list);
  renderTimeline(allOpps.filter(o => o.deadline !== 'rolling').sort((a,b) => new Date(a.deadline)-new Date(b.deadline)).slice(0,15));
  updateStats(list);
  document.getElementById('resultCount').textContent = `${list.length} result${list.length!==1?'s':''}`;
}

// ── render grid ──────────────────────────────────────────────────────────────
const typeLabel  = {grant:'Grant',competition:'Competition',accelerator:'Accelerator',corporate:'Corporate Program',award:'Award'};
const locLabel   = {nyc:'NYC',national:'National',virtual:'Virtual',global:'Global'};
const secLabel   = {edtech:'EdTech',ai:'AI',women:'Women',bipoc:'BIPOC',general:'General'};

function renderGrid(list) {
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="no-results"><svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><br/>No opportunities match your filters.</div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

function cardHTML(o) {
  const status   = deadlineStatus(o.deadline);
  const fresh    = isNew(o.addedDate);
  const saved    = savedIds.has(o.id);
  const cdText   = countdownText(o.deadline);
  const isAuto   = o.source === 'auto';

  const pillClass = status === 'urgent' ? 'urgent' : status === 'soon' ? 'soon' : status === 'rolling' ? 'rolling' : 'normal';
  const pillEmoji = status === 'urgent' ? '🔴' : status === 'soon' ? '🟡' : status === 'rolling' ? '🔵' : '📅';

  const urgentBorder = status === 'urgent' ? 'urgent' : status === 'soon' ? 'soon' : fresh ? 'new-opp' : '';

  return `
  <div class="card ${urgentBorder}" id="card-${o.id}">
    ${fresh ? `<div class="new-badge">✨ New</div>` : ''}
    <div class="card-top">
      <div class="card-title">${esc(o.name)}</div>
      <div class="prize-badge">${esc(o.prize)}</div>
    </div>
    <div class="card-desc">${esc(o.desc)}</div>
    <div class="deadline-row">
      <div class="deadline-pill ${pillClass}">${pillEmoji} ${esc(o.deadlineLabel)}</div>
      ${cdText ? `<span class="countdown ${status === 'urgent' ? 'urgent' : status === 'soon' ? 'soon' : 'normal'}">${cdText}</span>` : ''}
    </div>
    <div class="tags">
      <span class="tag tag-type-${o.type}">${typeLabel[o.type]||o.type}</span>
      ${o.loc.map(l=>`<span class="tag tag-loc-${l}">${locLabel[l]||l}</span>`).join('')}
      ${o.sector.map(s=>`<span class="tag tag-sector-${s}">${secLabel[s]||s}</span>`).join('')}
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <span class="equity-badge ${o.equity===false ? 'no-equity' : 'has-equity'}">
        ${o.equity===false ? '✓ Non-dilutive' : '⚠ May involve equity'}
      </span>
      ${isAuto ? `<span class="source-auto">🤖 Auto-found</span>` : ''}
    </div>
    <div class="card-actions">
      <a class="btn-apply" href="${o.url}" target="_blank" rel="noopener">Apply / Learn More →</a>
      <button class="btn-save ${saved?'saved':''}" onclick="toggleSave(${o.id},this)" title="${saved?'Saved':'Save for later'}">${saved?'★':'☆'}</button>
    </div>
  </div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── timeline ─────────────────────────────────────────────────────────────────
function renderTimeline(list) {
  const el = document.getElementById('timeline');
  if (!list.length) { el.innerHTML = '<div style="color:var(--muted);font-size:12px;">No dated deadlines.</div>'; return; }
  el.innerHTML = list.map(o => {
    const s = deadlineStatus(o.deadline);
    return `<div class="tl-item" onclick="scrollToCard(${o.id})">
      <div class="tl-dot ${s}"></div>
      <div>
        <div class="tl-name">${esc(o.name)}</div>
        <div class="tl-date">${esc(o.deadlineLabel)}</div>
        <div class="tl-prize">${esc(o.prize)}</div>
      </div>
    </div>`;
  }).join('');
}

function scrollToCard(id) {
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
}

// ── stats ────────────────────────────────────────────────────────────────────
function updateStats(list) {
  document.getElementById('totalCount').textContent   = list.length;
  document.getElementById('urgentCount').textContent  = list.filter(o => deadlineStatus(o.deadline)==='urgent').length;
  document.getElementById('soonCount').textContent    = list.filter(o => deadlineStatus(o.deadline)==='soon').length;
  document.getElementById('newCount').textContent     = list.filter(o => isNew(o.addedDate)).length;
  document.getElementById('rollingCount').textContent = list.filter(o => o.deadline==='rolling').length;
}

// ── urgent banner ────────────────────────────────────────────────────────────
function buildBanner() {
  const urgent = allOpps.filter(o => {
    const n = daysUntil(o.deadline);
    return n >= 0 && n <= 5;
  });
  if (!urgent.length) return;
  const banner = document.getElementById('urgentBanner');
  const items  = document.getElementById('bannerItems');
  items.innerHTML = urgent.map(o => {
    const n = daysUntil(o.deadline);
    const label = n === 0 ? 'TODAY' : n === 1 ? '1 day' : `${n} days`;
    return `<span class="banner-chip" onclick="scrollToCard(${o.id})">${esc(o.name.split('—')[0].trim())} — ${label}</span>`;
  }).join('');
  banner.style.display = 'flex';
}

// ── save ──────────────────────────────────────────────────────────────────────
function toggleSave(id, btn) {
  if (savedIds.has(id)) { savedIds.delete(id); btn.textContent='☆'; btn.classList.remove('saved'); }
  else                  { savedIds.add(id);    btn.textContent='★'; btn.classList.add('saved'); }
  localStorage.setItem('ciq_saved', JSON.stringify([...savedIds]));
}

// ── init ─────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
