name: 🤖 Daily Opportunity Update

on:
  schedule:
    # Runs every day at 8:00 AM UTC (4am EST / 1am PST)
    - cron: '0 8 * * *'
  # Also lets you trigger it manually from GitHub's Actions tab
  workflow_dispatch:

jobs:
  update-opportunities:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data.json back to repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Run opportunity scraper
        run: python scraper.py

      - name: 💾 Commit updated data.json
        run: |
          git config --global user.name  "CanvasIQ Bot"
          git config --global user.email "bot@canvasiq.com"
          git add data.json
          # Only commit if data.json actually changed
          git diff --staged --quiet || git commit -m "🤖 Daily update: $(date +'%Y-%m-%d') — auto-scraped new opportunities"
          git push
